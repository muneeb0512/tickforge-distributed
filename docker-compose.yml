# Infrastructure for TickForge Distributed.
#
# This file grows one service at a time, in the milestone that first needs
# it - introducing a container before any code depends on it would violate
# this project's own rule that every technology has to answer a real,
# already-felt problem. Planned additions still to come:
#
#   Milestone 3 - redis
#   Milestone 4 - postgres
#   Milestone 6 - the C++ services themselves, containerized, plus
#                 healthchecks and depends_on wiring between all of the above
#
# See docs/architecture.md for the target topology this is building toward.

name: tickforge-distributed

services:
  # Milestone 2 - single-node Kafka broker, KRaft mode (no ZooKeeper - Kafka
  # 4.x removed it entirely; KRaft has the broker also serve as its own
  # metadata "controller", which is what KAFKA_PROCESS_ROLES below means).
  #
  # Config lifted from Apache Kafka's own official single-node example
  # (docker/examples/docker-compose-files/single-node/plaintext in the
  # apache/kafka repo), trimmed to what a single-node dev broker needs.
  # Two listeners matter for us specifically:
  #   - PLAINTEXT (broker:19092)      - how containers on this Compose
  #                                      network would reach the broker.
  #                                      Unused today (our C++ services run
  #                                      on the WSL2 host, not in a
  #                                      container, until Milestone 6) but
  #                                      wiring it now costs nothing.
  #   - PLAINTEXT_HOST (localhost:9092) - how our C++ producer/consumer,
  #                                      running on the host, actually
  #                                      reach it.
  kafka:
    image: apache/kafka:4.3.1
    hostname: broker
    container_name: tickforge-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://broker:19092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      # Fixed, arbitrary (but validly-formatted) cluster ID for this local
      # single-node dev cluster - not a secret, reused from Apache's own
      # published example verbatim.
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot container: creates the market-events topic with 3 partitions
  # (see docs/milestone-2-queue-kafka.md for why 3, and why partitioned by
  # instrument) once the broker is actually ready to accept admin calls,
  # then exits. Re-running `docker compose up` is safe - --if-not-exists
  # makes topic creation idempotent.
  kafka-topic-init:
    image: apache/kafka:4.3.1
    container_name: tickforge-kafka-topic-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --create --if-not-exists
      --topic market-events --partitions 3 --replication-factor 1
      --bootstrap-server broker:19092"
